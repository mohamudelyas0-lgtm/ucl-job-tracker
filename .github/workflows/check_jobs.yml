name: Check jobs

on:
  schedule:
    - cron: "17 */8 * * *"   # every 8 hours (00:17, 08:17, 16:17 UTC)
  workflow_dispatch:          # manual run: Actions tab -> Check jobs -> Run workflow

permissions:
  contents: write
  issues: write

concurrency:
  group: check-jobs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push tracker updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker.csv TRACKER.md state/
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update tracker $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi

      - name: Notify (open an issue) when new roles appear
        if: hashFiles('new_roles.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "New roles found $(date -u +'%d %b %H:%M UTC')" \
            --body-file new_roles.md
